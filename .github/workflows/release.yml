name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Read project version
        id: version
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pom.xml version ($VERSION)." >&2
            exit 1
          fi

          if echo "$VERSION" | grep -q -- "-SNAPSHOT"; then
            echo "Refusing to release SNAPSHOT version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: mvn --batch-mode --update-snapshots clean package

      - name: Smoke test CLI
        run: java -jar "target/jam4j-${{ steps.version.outputs.version }}.jar" --version

      - name: Create checksum
        run: shasum -a 256 "target/jam4j-${{ steps.version.outputs.version }}.jar" > "target/jam4j-${{ steps.version.outputs.version }}.jar.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "target/jam4j-${{ steps.version.outputs.version }}.jar" \
            "target/jam4j-${{ steps.version.outputs.version }}.jar.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME"
